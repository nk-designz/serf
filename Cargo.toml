[package]
name = "serf"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "serf — a suckless, keyboard-driven Servo browser for Wayland"
license = "MIT"
repository = "https://example.invalid/serf"
default-run = "serf"

[lib]
name = "serf"
path = "src/lib.rs"

[[bin]]
name = "serf"
path = "src/main.rs"

[[bin]]
name = "serf-msg"
path = "src/bin/serf-msg.rs"

[features]
default = []
# The Servo engine backend. Off by default because pulling it in requires
# building SpiderMonkey (mozjs_sys) from source — see README / BUILD notes.
servo = [ "dep:servo", "dep:euclid", "dep:url", "dep:webrender_api", "dep:tracing", "dep:pkcs1", "dep:keyboard-types" ]

[dependencies]
# --- Wayland-only windowing: no GTK, no Qt, no X11 ---
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }
# Raw Wayland client for the wlr-layer-shell status overlay (no toolkit layer,
# in the spirit of the suckless tools serf is modelled on).
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# --- Adblocking engine ---
adblock = "0.13"
memmap2 = "0.9"

# --- Config / IPC / hot reload ---
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
notify = "8"

# --- Allocator / logging / errors ---
mimalloc = { version = "0.1", default-features = false }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"

# --- Servo embedding backend (feature = "servo") ---
# Servo's own `default` is [bundled, clipboard, js_jit, multiprocess] and does
# NOT include default_web_features, so a bare dependency silently ships with no
# WebGL and no brotli. Enable the subset that resolves and that this hardware
# can actually use. Deliberately omitted:
#   webgpu    — Mali-T860 (Midgard v5) has no Vulkan; PanVK is Bifrost v6+ only.
#   webxr     — no XR hardware.
servo = { version = "0.7", optional = true, features = [
    "brotli-compression-stream",
    "webgl",
    "webcrypto",
    "media-gstreamer",
] }
# servo-script pins `rsa = "=0.10.0-rc.18"`, whose pkcs1 interop is written
# against `pkcs1::RsaPrivateKey<'a>` — the type took a LIFETIME in that series:
#
#   rsa-0.10.0-rc.18/src/encoding.rs:41
#     impl TryFrom<pkcs1::RsaPrivateKey<'_>> for RsaPrivateKey {
#
# `pkcs1 = "0.8.0-rc.4"` in rsa's manifest is a `^` range, so cargo legitimately
# resolves to the highest match. That order matters: 0.8.0-rc.4 has the lifetime,
# but rc.5 and the final 0.8.0 both changed the type to a generic `U`
# (`pub struct RsaPrivateKey<U>`), which no longer satisfies rsa rc.18 — 8 ×
# E0107, "struct takes 1 generic argument but 0 were supplied".
#
# So the pin has to be rc.4 exactly. NOT rc.5 and NOT the 0.8.0 release: those
# are the versions that break. rc.4 is on crates.io and unyanked.
pkcs1 = { version = "=0.8.0-rc.4", optional = true }
euclid = { version = "0.22", optional = true }
url = { version = "2", optional = true }
webrender_api = { version = "0.70", optional = true }
tracing = { version = "0.1", optional = true }
# Servo re-exports most of `keyboard_types`, but not `KeyboardEvent` itself —
# and `InputEvent::Keyboard` needs one. Pinned to the version servo requires so
# cargo unifies the two into a single crate and `servo::Key` stays the same type
# as the one in the event serf builds.
keyboard-types = { version = "0.8.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
