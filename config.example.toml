# serf configuration — copy to ~/.config/serf/config.toml
# Hot-reloaded at runtime: edits apply without restarting.

[general]
homepage = "https://duckduckgo.com/"
# Where serf advertises its IPC socket for serf-msg.
socket_path = "/tmp/serf.sock"
# Launch external fuzzy launchers for tab / history selection.
tab_launcher = "fuzzel --dmenu"
# Commands run when `o` (open) is pressed with an empty prompt, if set.
search_engine = "https://duckduckgo.com/?q=%s"
# "normal" is the default modality (surf-style: no persistent chrome).
start_mode = "normal"

[adblock]
enabled = true
# Filter lists. Plain text lists (EasyList syntax) or a prebuilt serialized
# cache produced by `serf --build-adblock-cache`.
lists = [
    "~/.local/share/serf/filters/easylist.txt",
]
# Memory-mapped serialized engine. When present, serf mmaps it instead of
# re-parsing the text lists — this is what keeps adblock RAM under ~15 MB.
cache = "~/.local/share/serf/filters/engine.dat"
# Cosmetic filtering: inject `display:none` CSS for matched selectors.
cosmetic = true
# Tags understood by uBlock-style `[$tag]` rules.
tags = ["serf", "linux"]

[theme]
# "pywal" reads ~/.cache/wal/colors.json; "catppuccin" uses a builtin;
# "static" uses the [colors] block below.
source = "catppuccin"
catppuccin_flavour = "mocha"
# Palette injected into pages as a user agent stylesheet (per-domain below).
inject_css = true

[colors]
# Used when theme.source = "static".
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#89b4fa"
dim = "#6c7086"
alert = "#f38ba8"

# Overlay status line appearance.
[overlay]
height = 22
font_scale = 1
position = "bottom"
# Show the URL of links under the cursor / after `f` hint activation.
show_url_on_hover = true

# Per-domain rules. `hide` entries are extra cosmetic selectors.
[domains."news.ycombinator.com"]
zoom = 1.15

[domains."example.com"]
hide = ["#cookie-banner", ".newsletter-modal"]
zoom = 1.0

# ---------------------------------------------------------------------------
# Keybindings
#
# The vim defaults below are built in and always loaded first; these tables are
# merged over them, so a config only needs the lines it changes. The block is a
# working example of those defaults — delete a line and the default still
# applies.
#
#   chord   space-separated key sequence: "g g", "<C-d>", "alt-r", "<Tab>"
#   action  a name from the list at the end of this file, or "none" to REMOVE a
#           default and free the key (the one thing merging cannot express)
#
# Key names: <Esc> <Enter> <Tab> <BS> <Space>, <C-x> for Control, <A-x> (or
# alt-x) for Alt, and any single character as itself. Case matters: "G" and "g"
# are different keys. One modifier per chord.
#
# Anything that cannot be understood is logged at startup as
# "serf: keybinding <mode>: ..." rather than failing silently.

[keybindings.normal]
# Vertical and horizontal scrolling.
"j" = "scroll-down"
"k" = "scroll-up"
"h" = "scroll-left"
"l" = "scroll-right"
"d" = "half-page-down"
"u" = "half-page-up"
"<C-d>" = "half-page-down"
"<C-u>" = "half-page-up"
"g g" = "scroll-top"
"G" = "scroll-bottom"

# Follow a link in this tab, or in a new one.
"f" = "hint"
"F" = "hint-new-tab"

# Open a URL; `O` starts from the current URL.
"o" = "open-prompt"
"O" = "open-prompt-edit"

# History and reload.
"H" = "history-back"
"L" = "history-forward"
"r" = "reload"

# Tabs. `T` opens the external tab launcher.
"J" = "tab-prev"
"K" = "tab-next"
"x" = "tab-close"
"t" = "tab-new"
"T" = "tab-menu"

# Modality, search, clipboard, quit.
":" = "enter-command"
"/" = "search"
"i" = "enter-insert"
"y" = "yank-url"
"p" = "paste-open"
"q" = "quit"

# Custom bindings go here too, e.g. a key that reloads and one that is freed:
# "alt-r" = "reload"
# "x" = "none"

[keybindings.insert]
# Insert mode forwards almost everything to the page.
"<Escape>" = "enter-normal"

[keybindings.command]
"<Escape>" = "enter-normal"
"<Enter>" = "command-submit"

# --- every action name, for reference ----------------------------------------
#
#   scroll-up  scroll-down  scroll-left  scroll-right
#   half-page-up  half-page-down  scroll-top  scroll-bottom
#   hint  hint-new-tab
#   open-prompt  open-prompt-edit
#   search  search-reverse
#   history-back  history-forward  reload
#   tab-next  tab-prev  tab-close  tab-new  tab-menu
#   yank-url  paste-open
#   enter-normal  enter-insert  enter-command  command-submit
#   quit
