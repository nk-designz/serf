name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A cold Servo build is hours; a newer push supersedes it, and two of them
# racing on the same ref just burns two runners. The cache still survives
# (rust-cache saves in a post step), so the restart resumes warm.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal on every push: everything except the web engine.
  default:
    name: default build + tests (no Servo)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets --locked
      - name: cargo test
        run: cargo test --locked

  # The heavy one: the real Servo engine. Builds SpiderMonkey (mozjs_sys)
  # from source, which is why this runs natively on aarch64 with a 6 hour
  # budget and a warm cache rather than on the Pinebook Pro.
  servo:
    name: servo build (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    # Runs on pushes to main and on manual dispatch, but not on PRs: a cold
    # SpiderMonkey build is hours, and that is not a per-PR cost.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install SpiderMonkey + media build toolchain
        run: |
          sudo apt-get update
          # The gstreamer*-sys crates resolve their libraries through pkg-config,
          # so the -dev packages are build-time requirements once the servo
          # `media-gstreamer` feature is on (plain `libgstreamer1.0-dev` alone is
          # not enough: app/audio/video/base come from plugins-base, and
          # play/sdp/webrtc from plugins-bad).
          sudo apt-get install -y --no-install-recommends \
            clang cmake python3 make automake autoconf \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Confirm the GStreamer pkg-config modules resolve
        run: |
          # Fail here with a readable message rather than 15 minutes into the
          # build if one of the -dev packages is missing or renamed.
          for m in gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0 \
                   gstreamer-video-1.0 gstreamer-base-1.0 gstreamer-sdp-1.0 \
                   gstreamer-webrtc-1.0 gstreamer-play-1.0; do
            pkg-config --exists "$m" || { echo "MISSING: $m"; exit 1; }
            echo "$m -> $(pkg-config --modversion "$m")"
          done

      - uses: dtolnay/rust-toolchain@stable

      # The mozjs compile is the expensive part; keep the cache warm and
      # keyed to the Servo feature so it is not evicted by the default job.
      - uses: Swatinem/rust-cache@v2
        with:
          key: servo-arm64
          cache-targets: true

      - name: Confirm the target flags reached the build
        run: |
          echo "arch: $(uname -m), cores: $(nproc), mem: $(free -h | awk '/^Mem:/{print $2}')"
          grep -A4 'target.aarch64' .cargo/config.toml

      - name: Build with the Servo engine
        run: cargo build --release --features servo --locked -j "$(nproc)"

      - name: Unit tests with the Servo engine
        run: cargo test --release --features servo --locked -j "$(nproc)" --lib

      - name: Report the artifact
        run: |
          ls -lh target/release/serf target/release/serf-msg
          file target/release/serf

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: serf-aarch64-servo
          path: |
            target/release/serf
            target/release/serf-msg
          if-no-files-found: error
